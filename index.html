<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blåvitt Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="tb-brand">
      <div class="brand-badge">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="4"  width="16" height="2.2" fill="white" rx="0.5"/>
          <rect x="2" y="8.9" width="16" height="2.2" fill="white" rx="0.5"/>
          <rect x="2" y="13.8"width="16" height="2.2" fill="white" rx="0.5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Blåvitt Analytics</div>
        <div class="brand-sub">Allsvenskan · FBRef</div>
      </div>
    </div>

    <nav class="tb-nav" id="main-nav">
      <button class="nav-btn active" data-tab="team">Göteborg</button>
      <button class="nav-btn" data-tab="player">Spelare</button>
      <button class="nav-btn" data-tab="compare">Jämför</button>
      <button class="nav-btn" data-tab="league">Liga</button>
      <button class="nav-btn" data-tab="top">Topplista</button>
    </nav>

    <div class="tb-controls">
      <div class="season-group" id="season-group"></div>
      <div class="squad-toggle" id="squad-toggle">
        <button class="sq-btn active" data-squad="Göteborg">IFK Gbg</button>
        <button class="sq-btn" data-squad="ALL">Hela ligan</button>
      </div>
    </div>
  </header>

  <!-- CONTENT AREA -->
  <main id="content">
    <div id="loading-screen" class="loading-screen">
      <div class="load-spinner"></div>
      <div class="load-text">Laddar statistik…</div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
